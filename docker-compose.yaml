# ksamods.gg - deployment for Coolify.
#
# Two long-running services plus a one-shot migration, against a Postgres you run elsewhere. Only
# the frontend is reachable from outside: the API publishes no ports, and the browser reaches it
# through the frontend's own reverse proxy (KsaMods.Web/Services/ApiProxy.cs). That is what lets
# the session cookie stay HttpOnly and SameSite=Lax with no CORS policy anywhere.
#
# DATABASE_URL is required and has no default. A default would be worse than a failed deploy:
# every service would quietly come up pointing at a database that is not yours, and the first sign
# of it would be an empty site. `${DATABASE_URL:?...}` makes compose refuse to start instead.
#
#   DATABASE_URL=postgres://user:password@host:5432/ksamods
#
# Add ?sslmode=require for a managed database that expects TLS. The API accepts this URL form and
# the libpq key/value form equally (KsaMods.Api/Data/Database.cs).
#
# Coolify specifics used here:
#   · SERVICE_FQDN_WEB_8080 - declared with no value so Coolify generates a domain, terminates TLS,
#                             and routes it to this service's port 8080. Override it in the UI
#                             before the first deploy if you have a domain ready.

services:
  # One-shot: runs to completion before the API starts, and again on every deploy. It tracks what
  # it has applied in a schema_migration table, so re-running is a no-op rather than an error.
  #
  # Built rather than bind-mounted. A deployment tool that runs `docker compose` inside a helper
  # container - Coolify does - resolves relative bind mounts against the helper's filesystem while
  # the daemon resolves them against the host's. The paths do not match, the daemon creates an
  # empty directory, and the migration file is silently absent. Baking it into the image makes
  # this work identically everywhere.
  migrate:
    build:
      context: ./db
      dockerfile: Dockerfile
    restart: "no"
    environment:
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL to postgres://user:password@host:5432/dbname}

  api:
    build:
      context: .
      dockerfile: src/KsaMods.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL to postgres://user:password@host:5432/dbname}
      # The address people type. Required for sign-in, because the OAuth redirect_uri must match
      # what is registered with the provider exactly - and inside the compose network the API's
      # own request host is "api:8080", which is not somewhere a browser can go.
      #
      # Defaults to the domain Coolify generated. Override PUBLIC_BASE_URL when you point a real
      # domain at this.
      - Site__PublicBaseUrl=${PUBLIC_BASE_URL:-${SERVICE_FQDN_WEB_8080:-}}
      # Sign-in is only offered when these are set. Left empty, the frontend hides the button and
      # the auth routes explain what is missing - a working read-only site, not a broken button.
      - OAuth__GitHub__ClientId=${GITHUB_CLIENT_ID:-}
      - OAuth__GitHub__ClientSecret=${GITHUB_CLIENT_SECRET:-}
      - OAuth__Discord__ClientId=${DISCORD_CLIENT_ID:-}
      - OAuth__Discord__ClientSecret=${DISCORD_CLIENT_SECRET:-}
    # No published ports: reachable only from the web service, over the compose network.
    expose:
      - "8080"
    healthcheck:
      # The runtime image is chiselled - no shell, no curl, no wget - so the app probes itself.
      # See KsaMods.Api/HealthProbe.cs.
      test: ["CMD", "/app/KsaMods.Api", "--healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: src/KsaMods.Web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # No value: Coolify generates the domain and wires up its proxy.
      - SERVICE_FQDN_WEB_8080
      - ASPNETCORE_ENVIRONMENT=Production
      # Service name, not localhost - these are separate containers.
      - Api__BaseUrl=http://api:8080
      # TLS terminates at Coolify's proxy. Redirecting to https here would loop, and an OAuth
      # redirect_uri built from the request scheme would come out as http://.
      - BehindProxy=true
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/app/KsaMods.Web", "--healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
