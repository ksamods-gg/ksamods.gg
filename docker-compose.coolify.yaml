# Background services for ksamods.gg on Coolify: the queue worker, the scheduler and Reverb.
#
# The production stack is three Coolify resources, so the website gets rolling updates
# (Coolify only does those for single-container applications, never for compose):
#
# 1. Database: a Coolify MySQL 8.4 database resource. Not part of any deploy.
# 2. Website: a Coolify Application, build pack "Dockerfile", from this repository.
#    - Port 8080; domain https://ksamods.gg.
#    - Health check enabled: path /up, port 8080. Rolling updates need it.
#    - Migrations run as each new container starts, while the old one still serves,
#      so a migration must not break the running release (add, then remove in a later deploy).
#    - SSR runs inside this container.
# 3. This compose file: Reverb (domain https://ws.ksamods.gg on port 8080), the queue worker
#    and the scheduler.
#    Enable "Connect To Predefined Network" so they can reach the database.
#
# Define these once as Shared Variables on the Coolify environment, and reference them from
# both the Application and this resource (for example {{environment.APP_KEY}}):
#   APP_KEY                       php artisan key:generate --show
#   APP_URL                       https://ksamods.gg
#   DB_HOST, DB_DATABASE, DB_USERNAME, DB_PASSWORD
#                                 from the database resource (its internal hostname)
#   REVERB_APP_ID, REVERB_APP_KEY, REVERB_APP_SECRET
#                                 any random strings; the key is public, the secret is not
#   REVERB_HOST                   ws.ksamods.gg
#
#   The share host for vehicles and saves (RFC 0094, own storage, signed):
#   SHARE_DISK=s3, and AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_BUCKET,
#   AWS_DEFAULT_REGION (fsn1), AWS_ENDPOINT (https://fsn1.your-objectstorage.com)
#                                 a Hetzner Object Storage bucket. Keep the bucket private:
#                                 each published file is made public on its own, while
#                                 uploads waiting for checks stay private.
#   SHARE_PUBLIC_URL              where the bucket serves files, such as
#                                 https://<bucket>.fsn1.your-objectstorage.com/ ; it is `data`
#   SHARE_SIGNING_KEY             php artisan share:key ; secret, signs every data file
#   SHARE_BOT_ID                  the numeric id of the GitHub App's bot user, such as
#                                 ksamods-gg[bot] (https://api.github.com/users/ksamods-gg%5Bbot%5D)
#   SHARE_GITHUB_APP_ID, SHARE_GITHUB_APP_PRIVATE_KEY
#                                 the GitHub App that opens listing pull requests (its App ID,
#                                 and the .pem it generates, pasted as a multiline value);
#                                 installed on the authored repository with Pull requests
#                                 write, and no write access to code
#   SHARE_FORK                    the host's fork of the authored repository, such as
#                                 ksamods-gg/content-index
#   SHARE_FORK_TOKEN              a fine-grained token, resource owner the fork's owner, for
#                                 SHARE_FORK only, with Contents read and write; pushes the
#                                 pull requests' branches
#   SHARE_AUTHORED_REPOSITORY     a test repository until ksamods is registered in
#                                 hosts.toml, then KSAModding/content-index
#   SHARE_ABUSE_EMAIL, SHARE_DISCORD_URL   the contacts on /policy
#   IA_ACCESS_KEY, IA_SECRET_KEY  https://archive.org/account/s3.php of the archive.org account
#                                 that owns the mirrors (rule 19); empty turns mirroring off
#   IA_COLLECTION                 opensource_media, or the collection archive.org gives you
#   PASSPORT_PRIVATE_KEY, PASSPORT_PUBLIC_KEY
#                                 php artisan passport:keys, then the two files' contents;
#                                 they sign the upload API's tokens
#   Then print the hosts.toml table to register with: php artisan share:host
#
# The Application additionally needs:
#   APP_ENV=production, APP_DEBUG=false, LOG_CHANNEL=stderr, DB_CONNECTION=mysql,
#   AUTORUN_ENABLED=true, SESSION_SECURE_COOKIE=true,
#   BROADCAST_CONNECTION=reverb, REVERB_PORT=443, REVERB_SCHEME=https,
#   GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET    GitHub OAuth App (not a GitHub App), callback
#                                             https://ksamods.gg/auth/github/callback
#   DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET  Discord OAuth2 redirect
#                                             https://ksamods.gg/auth/discord/callback
#   LEGAL_OPERATOR_NAME, LEGAL_CONTACT_EMAIL, LEGAL_COUNTRY
#                                             who runs the site, for /privacy and /terms
#   and, marked "Build Variable" because they are baked into the JavaScript:
#   VITE_APP_NAME=ksamods.gg, VITE_REVERB_APP_KEY (same as REVERB_APP_KEY),
#   VITE_REVERB_HOST=ws.ksamods.gg
#   and every share host variable above.
#
# After the first deploy, make yourself an admin from the Application's terminal:
#   php artisan ksamods:admin <github login or discord username>
services:
    # Sends queued jobs, including notification broadcasts to Reverb.
    queue:
        build:
            context: .
        command: ['php', '/var/www/html/artisan', 'queue:work', '--tries=3']
        stop_signal: SIGTERM
        healthcheck:
            test: ['CMD', 'healthcheck-queue']
        environment:
            - APP_NAME=${APP_NAME:-ksamods.gg}
            - APP_ENV=production
            - APP_DEBUG=false
            - APP_KEY=${APP_KEY:?}
            - APP_URL=${APP_URL:?}
            - LOG_CHANNEL=stderr
            - DB_CONNECTION=mysql
            - DB_HOST=${DB_HOST:?}
            - DB_DATABASE=${DB_DATABASE:?}
            - DB_USERNAME=${DB_USERNAME:?}
            - DB_PASSWORD=${DB_PASSWORD:?}
            - BROADCAST_CONNECTION=reverb
            - REVERB_APP_ID=${REVERB_APP_ID:?}
            - REVERB_APP_KEY=${REVERB_APP_KEY:?}
            - REVERB_APP_SECRET=${REVERB_APP_SECRET:?}
            # Through the public domain, the same way the website reaches it.
            - REVERB_HOST=${REVERB_HOST:?}
            - REVERB_PORT=443
            - REVERB_SCHEME=https
            # Retries a listing pull request that GitHub refused, which writes data files.
            - SHARE_DISK=${SHARE_DISK:-s3}
            - SHARE_PUBLIC_URL=${SHARE_PUBLIC_URL:?}
            - SHARE_SIGNING_KEY=${SHARE_SIGNING_KEY:?}
            - SHARE_GITHUB_APP_ID=${SHARE_GITHUB_APP_ID:?}
            - SHARE_GITHUB_APP_PRIVATE_KEY=${SHARE_GITHUB_APP_PRIVATE_KEY:?}
            - SHARE_FORK=${SHARE_FORK:-ksamods-gg/content-index}
            - SHARE_FORK_TOKEN=${SHARE_FORK_TOKEN}
            - SHARE_BOT_ID=${SHARE_BOT_ID:?}
            - SHARE_AUTHORED_REPOSITORY=${SHARE_AUTHORED_REPOSITORY:?}
            - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:?}
            - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:?}
            - AWS_BUCKET=${AWS_BUCKET:?}
            - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-fsn1}
            - AWS_ENDPOINT=${AWS_ENDPOINT:-https://fsn1.your-objectstorage.com}
            # Internet Archive mirrors (rule 19); mirroring is off while these are empty.
            - IA_ACCESS_KEY=${IA_ACCESS_KEY:-}
            - IA_SECRET_KEY=${IA_SECRET_KEY:-}
            - IA_COLLECTION=${IA_COLLECTION:-opensource_media}
            # A mirror upload may take 20 minutes; no other worker may take its job before then.
            - DB_QUEUE_RETRY_AFTER=1500

    # Runs scheduled commands: discarding expired uploads and spent sign-ins.
    scheduler:
        build:
            context: .
        command: ['php', '/var/www/html/artisan', 'schedule:work']
        stop_signal: SIGTERM
        healthcheck:
            test: ['CMD', 'healthcheck-schedule']
        environment:
            - APP_ENV=production
            - APP_DEBUG=false
            - APP_KEY=${APP_KEY:?}
            - LOG_CHANNEL=stderr
            - DB_CONNECTION=mysql
            - DB_HOST=${DB_HOST:?}
            - DB_DATABASE=${DB_DATABASE:?}
            - DB_USERNAME=${DB_USERNAME:?}
            - DB_PASSWORD=${DB_PASSWORD:?}
            - SHARE_DISK=${SHARE_DISK:-s3}
            - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:?}
            - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:?}
            - AWS_BUCKET=${AWS_BUCKET:?}
            - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-fsn1}
            - AWS_ENDPOINT=${AWS_ENDPOINT:-https://fsn1.your-objectstorage.com}

    reverb:
        build:
            context: .
        command: ['php', '/var/www/html/artisan', 'reverb:start']
        stop_signal: SIGTERM
        healthcheck:
            test: ['CMD', 'healthcheck-reverb']
        environment:
            - SERVICE_URL_REVERB_8080
            - APP_ENV=production
            - APP_DEBUG=false
            - APP_KEY=${APP_KEY:?}
            - LOG_CHANNEL=stderr
            - REVERB_APP_ID=${REVERB_APP_ID:?}
            - REVERB_APP_KEY=${REVERB_APP_KEY:?}
            - REVERB_APP_SECRET=${REVERB_APP_SECRET:?}
            - REVERB_HOST=${REVERB_HOST:?}
            # Reverb checks the app's cache, which lives in the database, for a restart signal.
            - DB_CONNECTION=mysql
            - DB_HOST=${DB_HOST:?}
            - DB_DATABASE=${DB_DATABASE:?}
            - DB_USERNAME=${DB_USERNAME:?}
            - DB_PASSWORD=${DB_PASSWORD:?}
